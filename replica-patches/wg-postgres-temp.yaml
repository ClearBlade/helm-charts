apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-postgres-temp
  namespace: community
  labels:
    app: wg-postgres-temp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wg-postgres-temp
  template:
    metadata:
      labels:
        app: wg-postgres-temp
    spec:
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                # Only needed if the node's kernel lacks a built-in wireguard
                # module (GKE COS nodes on kernel 5.6+ already have it):
                # - SYS_MODULE
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            # Any node's external IP works - NodePort listens on all of them.
            - name: SERVERURL
              value: "136.112.6.206"
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "1"
            - name: PEERDNS
              value: "off"
            # Arbitrary tunnel subnet, not overlapping pod (10.92.0.0/14),
            # service (34.118.224.0/20), or node (10.111.0.0/24) CIDRs.
            - name: INTERNAL_SUBNET
              value: "10.13.13.0"
            # Routes pushed to the CLIENT config - scoped to just the
            # postgres pod IP. Widen only if you need more than that one host.
            - name: ALLOWEDIPS
              value: "10.92.3.63/32"
          ports:
            - containerPort: 51820
              protocol: UDP
          volumeMounts:
            - name: wg-config
              mountPath: /config
      volumes:
        - name: wg-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wg-postgres-temp
  namespace: community
  labels:
    app: wg-postgres-temp
spec:
  type: NodePort
  selector:
    app: wg-postgres-temp
  ports:
    - port: 51820
      targetPort: 51820
      nodePort: 31820
      protocol: UDP
