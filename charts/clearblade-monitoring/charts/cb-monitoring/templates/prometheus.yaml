{{- if eq (default .Values.global.gmpEnabled false) false}}
{{- $usePersistentDisk := or .Values.prometheusDisk .Values.prometheusVolumeHandle }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-frontend
  namespace: {{ default "monitoring" .Values.global.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-frontend
  template:
    metadata:
      labels:
        app: prometheus-frontend
    spec:
      securityContext: 
        runAsUser: 0
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      containers:
        - name: prometheus-frontend
          image: prom/prometheus:{{ .Values.version }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/"
          {{- if .Values.retentionLength}}
            - "--storage.tsdb.retention.time={{ .Values.retentionLength }}" #example 30d
          {{- else if .Values.retentionSize}}
            - "--storage.tsdb.retention.size={{ .Values.retentionSize }}"  #example 70GB
          {{- else }}
            {{- $raw := atoi (regexReplaceAll "[^0-9]" .Values.prometheusDiskSize "") }}
            {{- $calc := div (mul $raw 70) 100 }}
            - "--storage.tsdb.retention.size={{ printf "%dGB" $calc }}"
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resourceRequests.cpu }}
              memory: {{ .Values.resourceRequests.memory }}
            limits:
              cpu: {{ .Values.resourceLimits.cpu }}
              memory: {{ .Values.resourceLimits.memory }}
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/
            - name: prometheus-storage-volume
              mountPath: /prometheus/
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-server-conf
        - name: prometheus-storage-volume
          {{- if $usePersistentDisk }}
          persistentVolumeClaim:
            claimName: prometheus-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- if .Values.global.tolerations }}
      tolerations:
{{ .Values.global.tolerations | toYaml | indent 6 }}
      {{- end }}
      {{- if .Values.global.nodePool }}
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.global.nodePool }}
      {{- else if .Values.prometheusVolumeAZ }}
      nodeSelector:
        topology.kubernetes.io/zone: {{ .Values.prometheusVolumeAZ }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-frontend
  namespace: {{ default "monitoring" .Values.global.namespace }}
  labels:
{{ include "cb-monitoring.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
    app: prometheus-frontend
  ports:
    - name: web
      port: 9090
{{- if $usePersistentDisk }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: {{ default "monitoring" .Values.global.namespace }}
spec:
  storageClassName: {{ .Values.global.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.prometheusDiskSize}}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-pv
  namespace: {{ default "monitoring" .Values.global.namespace }}
spec:
  storageClassName: {{ .Values.global.storageClassName }}
  {{- if eq .Values.global.cloud "aws" }}
  persistentVolumeReclaimPolicy: Retain
  {{- end }}
  capacity:
    storage: {{ .Values.prometheusDiskSize}}
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: {{ default "monitoring" .Values.global.namespace }}
    name: prometheus-pvc
  csi:
  {{- if eq .Values.global.cloud "aws" }}
    driver: ebs.csi.aws.com
    volumeHandle: {{ .Values.prometheusVolumeHandle }}
  {{- else }}
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/{{ .Values.global.gcpProject }}/regions/{{ .Values.global.gcpRegion }}/disks/{{ .Values.prometheusDisk}}
    fsType: ext4
  {{- end }}
{{- end }}
{{- end}}
