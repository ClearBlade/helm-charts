apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: pubsub-emulator
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: pubsub-emulator
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: pubsub-emulator
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: pubsub-emulator
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PUBSUB_PROJECT1
              value: {{ printf "%s%s" (required "projectID is required" .Values.projectID) (include "pubsub-emulator.topicList" .) | quote }}
            - name: PUBSUB_EMULATOR_HOST
              value: "0.0.0.0:{{ .Values.port }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
